services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alphatekx
      POSTGRES_USER: alphatekx
      POSTGRES_PASSWORD: alphatekx
    ports:
      - "5432:5432"
    volumes:
      - alphatekx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphatekx -d alphatekx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alphatekx-postgres:
